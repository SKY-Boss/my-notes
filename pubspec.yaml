name: my_notes
description: "高性能本地笔记应用 - 替代原子笔记"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 数据存储
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # 富文本编辑
  flutter_quill: ^11.5.0
  
  # 媒体
  image_picker: ^1.1.2
  video_player: ^2.9.3
  video_thumbnail: ^0.5.3
  
  # 安全
  local_auth: ^2.3.0
  
  # 工具
  provider: ^6.1.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  flutter_slidable: ^3.1.1
  
  # 云同步 - 坚果云 WebDAV
  webdav_client: ^1.2.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
